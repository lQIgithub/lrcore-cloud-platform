# Tomcat
server:
  port: ${lrcore.rule-port}

# Spring
spring:
  application:
    # 应用名称
    name: ${service-name-rule}
  profiles:
    # 环境配置
    active: ${nacos.active}
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        username: ${nacos.username}
        password: ${nacos.password}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        username: ${nacos.username}
        password: ${nacos.password}
  config:
    import:
      - nacos:application-${nacos.active}.${nacos.file-extension}
      - nacos:${service-name-rule}-${nacos.active}.${nacos.file-extension}
