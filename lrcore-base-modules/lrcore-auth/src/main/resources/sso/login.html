<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一登录 · lrcore 认证中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-0: #060913;
      --bg-1: #0b1226;
      --ink: #eaf3ff;
      --muted: #95a7c9;
      --faint: #4d5f86;
      --cyan: #2fd9ff;
      --violet: #6d6bff;
      --mint: #37ffc3;
      --amber: #ffb454;
      --panel: rgba(16, 24, 48, .55);
      --glass: rgba(255, 255, 255, .05);
      --stroke: rgba(255, 255, 255, .09);
      --mono: "Inter", "JetBrains Mono", "SF Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--mono);
      color: var(--ink);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(1100px 700px at 75% 15%, rgba(109, 107, 255, .18), transparent 60%),
        radial-gradient(1000px 800px at 12% 88%, rgba(47, 217, 255, .12), transparent 60%),
        radial-gradient(800px 500px at 50% 0%, rgba(55, 255, 195, .05), transparent 55%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #070b1a 100%);
    }
    /* 背景流动光束 */
    .aurora {
      position: fixed; inset: -30%; pointer-events: none; z-index: 0;
      filter: blur(90px); opacity: .5; mix-blend-mode: screen;
    }
    .aurora span {
      position: absolute; width: 46vw; height: 46vw; border-radius: 50%;
      mix-blend-mode: screen; will-change: transform;
    }
    .aurora .a { top: 12%; left: 8%;  background: radial-gradient(circle, #2fd9ff 0%, transparent 62%); animation: floatA 22s ease-in-out infinite; }
    .aurora .b { top: 34%; right: 2%; background: radial-gradient(circle, #6d6bff 0%, transparent 62%); animation: floatB 26s ease-in-out infinite; }
    .aurora .c { bottom: -8%; left: 26%; background: radial-gradient(circle, #37ffc3 0%, transparent 60%); animation: floatC 30s ease-in-out infinite; }
    @keyframes floatA { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,-50px) scale(1.15)} }
    @keyframes floatB { 0%,100%{transform:translate(0,0) scale(1.1)} 50%{transform:translate(-70px,40px) scale(.95)} }
    @keyframes floatC { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,60px) scale(1.12)} }

    /* 精细网格叠层 */
    .mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(80% 80% at 50% 50%, #000 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(80% 80% at 50% 50%, #000 0%, transparent 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(130% 130% at 50% 50%, transparent 40%, rgba(0,0,0,.45) 100%);
    }

    /* ---------- 主卡片（双栏玻璃） ---------- */
    .shell {
      position: relative; z-index: 3;
      width: 860px; max-width: calc(100vw - 32px);
      min-height: 540px;
      display: grid; grid-template-columns: 300px 1fr;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02) 40%, rgba(255,255,255,.05));
      border: 1px solid var(--stroke);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      box-shadow: 0 40px 120px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
      overflow: hidden;
    }
    .shell::before {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(120deg, rgba(255,255,255,.06) 0%, transparent 32%, transparent 68%, rgba(47,217,255,.05) 100%);
    }

    /* ===== 左侧品牌区 ===== */
    .side {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 40px 28px 32px;
      background:
        linear-gradient(165deg, rgba(47,217,255,.16), rgba(109,107,255,.12) 55%, rgba(16,24,48,.2)),
        radial-gradient(140% 90% at 0% 100%, rgba(47,217,255,.14), transparent 60%);
      border-right: 1px solid var(--stroke);
      overflow: hidden;
    }
    /* 侧栏装饰扫描在底部 */
    .side::after {
      content: ""; position: absolute; left: -20%; right: -20%; bottom: 0; height: 2px; z-index: 1;
      background: linear-gradient(90deg, transparent, var(--cyan) 40%, var(--mint) 60%, transparent);
      box-shadow: 0 0 18px rgba(47,217,255,.7);
    }
    /* 侧栏顶部边光 */
    .side::before {
      content: ""; position: absolute; top: 26px; left: 28px; right: 28px; height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.4), transparent);
    }

    .side .brand-top { display: flex; align-items: center; gap: 12px; }
    .side .brand-top .badge {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #04121a;
      background: linear-gradient(140deg, var(--cyan), var(--violet));
      box-shadow: 0 6px 24px rgba(47,217,255,.45);
    }
    .side .brand-top .org { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
    .side .brand-top .org small { display: block; font-weight: 400; font-size: 9.5px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

    .side .brand-core { position: relative; padding: 26px 0; }
    .side .brand-core h1 { font-size: 24px; font-weight: 800; letter-spacing: 1px; line-height: 1.3;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .side .brand-core p { margin-top: 12px; font-size: 12px; line-height: 1.9; color: var(--muted); }

    .side .brand-core .orbit {
      position: absolute; top: -8px; right: -8px; width: 40px; height: 40px; pointer-events: none;
    }
    .side .brand-core .orbit::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 1px dashed rgba(47,217,255,.45); animation: spin 14s linear infinite;
    }
    .side .brand-core .orbit::after {
      content: ""; position: absolute; top: 0; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
      border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .side .feature { display: grid; gap: 12px; }
    .side .feature .row { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
    .side .feature .row .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .side .feature .row:nth-child(1) .dot { background: var(--mint); box-shadow: 0 0 10px var(--mint); }
    .side .feature .row:nth-child(2) .dot { background: var(--violet); box-shadow: 0 0 10px var(--violet); }
    .side .feature .row:nth-child(3) .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

    .side .side-foot { font-size: 10px; color: var(--faint); letter-spacing: 1px; }
    .side .side-foot b { color: var(--cyan); font-weight: 600; }

    /* ===== 右侧表单区 ===== */
    .form-side { position: relative; z-index: 1; padding: 40px 44px 30px; display: flex; flex-direction: column; }
    .form-head { margin-bottom: 26px; }
    .form-head .kicker { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); opacity: .85; }
    .form-head h2 { margin-top: 6px; font-size: 20px; font-weight: 700; letter-spacing: .5px; }

    /* Alert */
    .alert {
      display: none; position: relative;
      padding: 12px 15px 12px 42px; margin-bottom: 18px;
      border-radius: 12px; font-size: 12.5px; line-height: 1.6;
      border: 1px solid; overflow: hidden;
    }
    .alert::before {
      content: "!"; position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      width: 17px; height: 17px; border-radius: 50%; text-align: center; line-height: 17px;
      font-weight: 700; font-size: 12px;
    }
    .alert-error { background: rgba(255,86,86,.1); color: #ffa3a3; border-color: rgba(255,86,86,.38); }
    .alert-error::before { background: #ff5656; color: #20050a; box-shadow: 0 0 12px rgba(255,86,86,.6); }
    .alert-success { background: rgba(55,255,195,.08); color: #5dffc8; border-color: rgba(55,255,195,.35); }
    .alert-success::before { background: var(--mint); color: #04130c; box-shadow: 0 0 12px rgba(55,255,195,.6); }

    /* 表单 */
    form { display: grid; gap: 16px; flex: 1; }
    .field label {
      display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 8px;
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-wrap .lead {
      position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
      color: var(--faint); font-size: 14px; pointer-events: none; transition: color .2s; z-index: 1;
    }
    .input-wrap input {
      width: 100%; height: 50px; padding: 0 16px 0 46px;
      font-size: 14px; font-family: inherit; color: var(--ink);
      background: rgba(6, 10, 24, .5);
      border: 1px solid var(--stroke);
      border-radius: 13px;
      outline: none; caret-color: var(--cyan);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .input-wrap input::placeholder { color: #3f4f77; }
    .input-wrap input:focus {
      border-color: rgba(47,217,255,.6);
      background: rgba(8, 14, 32, .8);
      box-shadow: 0 0 0 4px rgba(47,217,255,.10), 0 8px 24px rgba(47,217,255,.08);
    }
    .input-wrap input:focus ~ .lead { color: var(--cyan); }
    .input-wrap input.invalid { border-color: rgba(255,86,86,.55); box-shadow: 0 0 0 3px rgba(255,86,86,.12); }

    /* 验证码 */
    .captcha-row { display: flex; gap: 12px; }
    .captcha-row .input-wrap { flex: 1; }
    .captcha-img {
      width: 118px; height: 50px; flex-shrink: 0;
      border-radius: 13px; cursor: pointer;
      border: 1px solid var(--stroke); overflow: hidden;
      background: rgba(6,10,24,.5);
      display: flex; align-items: center; justify-content: center;
      color: var(--faint); font-size: 10.5px; letter-spacing: 1px;
      transition: border-color .2s, box-shadow .2s; position: relative;
    }
    .captcha-img:hover { border-color: rgba(47,217,255,.5); box-shadow: 0 0 16px rgba(47,217,255,.2); }
    .captcha-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .captcha-img.loading span::after {
      content: ""; display: inline-block; width: 13px; height: 13px; margin-left: 8px;
      border: 2px solid transparent; border-top-color: var(--cyan); border-radius: 50%;
      vertical-align: -2px; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 提交 */
    .submit-btn {
      margin-top: 6px;
      height: 52px; border: none; border-radius: 14px; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 4px; color: #031420;
      background: linear-gradient(100deg, var(--cyan), var(--mint));
      background-size: 180% 100%;
      box-shadow: 0 14px 34px rgba(47,217,255,.32);
      transition: transform .14s, box-shadow .22s, background-position .5s;
      position: relative; overflow: hidden;
    }
    .submit-btn::after {
      content: ""; position: absolute; left: -30%; width: 34%; top: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-20deg); animation: sheen 3.4s ease-in-out infinite;
    }
    @keyframes sheen { 0%,50%{left:-30%} 90%,100%{left:130%} }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 44px rgba(47,217,255,.45); background-position: 100% 0; }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; filter: saturate(.5); }

    .form-foot {
      margin-top: 18px; text-align: center;
      font-size: 10px; color: var(--faint); letter-spacing: 1px; line-height: 1.9;
    }
    .form-foot .tag {
      color: var(--cyan); background: rgba(47,217,255,.08);
      border: 1px solid rgba(47,217,255,.25); padding: 1px 7px; border-radius: 4px;
    }

    @media (max-width: 680px) {
      .shell { grid-template-columns: 1fr; }
      .side { padding: 26px 26px 20px; border-right: none; border-bottom: 1px solid var(--stroke); }
      .side .feature, .side .side-foot { display: none; }
      .side .brand-core { padding: 18px 0 4px; }
      .form-side { padding: 30px 24px 24px; }
    }
  </style>
</head>
<body>
  <div class="aurora">
    <span class="a"></span>
    <span class="b"></span>
    <span class="c"></span>
  </div>
  <div class="mesh"></div>

  <div class="shell">
    <!-- 左侧品牌面板 -->
    <aside class="side">
      <div class="brand-top">
        <div class="badge">L</div>
        <div class="org">lrcore Cloud<small>Auth Center</small></div>
      </div>

      <div class="brand-core">
        <span class="orbit"></span>
        <h1>统一认证中心</h1>
        <p>面向全平台的安全身份认证枢纽。一次登录，构建你的可信数字身份凭证。</p>
      </div>

      <div class="feature">
        <div class="row"><span class="dot"></span> 企业级加密传输</div>
        <div class="row"><span class="dot"></span> 动态验证与实时防护</div>
        <div class="row"><span class="dot"></span> 全平台单点通行</div>
      </div>

      <div class="side-foot">POWERED BY <b>LRCC-AUTH</b> · v2.4</div>
    </aside>

    <!-- 右侧登录表单 -->
    <section class="form-side">
      <div class="form-head">
        <div class="kicker">Secure Access</div>
        <h2>账户登录</h2>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display:__ERROR_DISPLAY__">__ERROR_MSG__</div>
      <div id="logoutAlert" class="alert alert-success" style="display:__LOGOUT_FLAG__">您已安全退出，可重新登录</div>

      <form id="loginForm" action="/login" method="post" autocomplete="off">
        <input type="hidden" name="_csrf" value="__CSRF_TOKEN__">

        <div class="field">
          <label for="username">用户名</label>
          <div class="input-wrap">
            <span class="lead">⌂</span>
            <input id="username" name="username" type="text" placeholder="请输入用户名 / 账号" required autofocus value="admin">
          </div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <span class="lead">◆</span>
            <input id="password" name="password" type="password" placeholder="请输入密码" required value="Lr@123456.">
          </div>
        </div>

        <div class="field">
          <label for="captcha">验证码</label>
          <div class="captcha-row">
            <div class="input-wrap">
              <span class="lead">&#9673;</span>
              <input id="captcha" name="captcha" type="text" maxlength="4" placeholder="4 位验证码" required>
            </div>
            <input type="hidden" id="captchaId" name="captchaId">
            <div class="captcha-img" id="captchaBox" title="点击刷新验证码">
              <span id="captchaTip">点击加载</span>
            </div>
          </div>
        </div>

        <button class="submit-btn" id="submitBtn" type="submit">登 录</button>
      </form>

      <div class="form-foot">
        登录即表示同意按本平台安全策略完成身份验证<br>
        <span class="tag">[SECURE]</span> 连续输错密码将触发账户 / IP 临时锁定
      </div>
    </section>
  </div>

  <script>
    (function () {
      var box = document.getElementById("captchaBox");
      var tip = document.getElementById("captchaTip");
      var idInput = document.getElementById("captchaId");
      var form = document.getElementById("loginForm");
      var submitBtn = document.getElementById("submitBtn");

      function loadCaptcha() {
        box.className = "captcha-img loading";
        tip.style.display = "";
        tip.textContent = "加载中";
        fetch("/sso/captcha", { credentials: "same-origin" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (body) {
            var data = body.data || body;
            if (!data || !data.uuid) throw new Error("invalid captcha response");
            idInput.value = data.uuid;
            box.className = "captcha-img";
            box.innerHTML = "";
            var img = document.createElement("img");
            img.src = data.img;
            img.alt = "验证码";
            box.appendChild(img);
            document.getElementById("captcha").value = "";
          })
          .catch(function () {
            box.className = "captcha-img";
            tip.textContent = "加载失败，点击重试";
          });
      }

      box.addEventListener("click", loadCaptcha);
      form.addEventListener("submit", function (e) {
        if (!idInput.value) {
          e.preventDefault();
          loadCaptcha();
          tip.textContent = "请先加载验证码";
          document.getElementById("captcha").classList.add("invalid");
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "验证中…";
      });
      form.querySelectorAll("input").forEach(function (i) {
        i.addEventListener("input", function () { this.classList.remove("invalid"); });
      });

      // 页面聚焦时自动加载一次（若已有错误提示，说明刚登录失败，验证码已被消费，必须刷新）
      if (document.getElementById("errorAlert").style.display === "block" || !idInput.value) {
        loadCaptcha();
      }
    })();
  </script>
</body>
</html>
