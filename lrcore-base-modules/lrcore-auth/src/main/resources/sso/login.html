<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一登录 - lrcore 认证中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-1: #070b1a;
      --bg-2: #0c1330;
      --accent: #22d3ee;
      --accent-2: #3b82f6;
      --accent-3: #22c55e;
      --cyber: #00f0ff;
      --text-hi: #eaf6ff;
      --text-mid: #9fb3d1;
      --text-low: #5c6f8f;
      --panel: rgba(13, 22, 48, .55);
      --panel-border: rgba(34, 211, 238, .22);
      --glow: 0 0 22px rgba(34, 211, 238, .35);
    }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(34, 211, 238, .16), transparent 55%),
        radial-gradient(1000px 700px at 85% 90%, rgba(59, 130, 246, .18), transparent 55%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 60%, #0a0f26 100%);
      color: var(--text-hi);
      overflow: hidden;
    }
    /* 网格背景 */
    .grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, .06) 1px, transparent 1px);
      background-size: 42px 42px;
      transform: perspective(600px) rotateX(58deg) translateY(-6%);
      transform-origin: 50% 100%;
      mask-image: linear-gradient(to top, #000 0%, transparent 70%);
      -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 70%);
      animation: gridMove 26s linear infinite;
      z-index: 0;
    }
    @keyframes gridMove {
      from { background-position: 0 0; }
      to   { background-position: 0 42px; }
    }
    /* 扫描光带 */
    .scanline {
      position: fixed; left: 0; right: 0; height: 2px; z-index: 1;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, .8), transparent);
      filter: blur(.5px);
      animation: scanY 9s linear infinite;
    }
    @keyframes scanY {
      0%   { top: -2%; }
      50%  { top: 100%; }
      100% { top: -2%; }
    }
    /* 流动粒子 */
    .particles { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
    .particles i {
      position: absolute; bottom: -10px;
      width: 2px; height: 2px; border-radius: 50%;
      background: var(--cyber);
      box-shadow: 0 0 6px var(--cyber);
      animation: rise linear infinite;
      opacity: 0;
    }
    @keyframes rise {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: .8; }
      90%  { opacity: .4; }
      100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
    }
    /* ===== 登录卡片 ===== */
    .login-wrap { position: relative; z-index: 2; width: 430px; max-width: calc(100vw - 40px); }
    .glow-ring {
      position: relative;
      padding: 1px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(34, 211, 238, .5), rgba(59, 130, 246, .25) 40%, rgba(34, 211, 238, .12) 70%, rgba(59, 130, 246, .5));
      animation: ringFlow 6s linear infinite;
      background-size: 300% 300%;
    }
    @keyframes ringFlow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .login-card {
      position: relative;
      border-radius: 19px;
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      padding: 38px 34px 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06);
      overflow: hidden;
    }
    .login-card::after {
      content: "";
      position: absolute; top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .06), transparent);
      transform: skewX(-20deg);
      animation: sheen 7s ease-in-out infinite;
    }
    @keyframes sheen { 0%,20%{left:-120%} 60%,100%{left:140%} }
    /* 角标 */
    .corner { position: absolute; width: 22px; height: 22px; z-index: 1; }
    .corner.tl { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner.tr { top: 10px; right: 10px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

    /* ===== 品牌区 ===== */
    .login-brand { text-align: center; margin-bottom: 26px; }
    .logo-core {
      position: relative;
      width: 60px; height: 60px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-hex {
      position: absolute; inset: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: linear-gradient(160deg, var(--accent), var(--accent-2));
      opacity: .18;
      animation: pulseHex 3s ease-in-out infinite;
      filter: blur(2px);
    }
    .logo-hex.dark { opacity: .5; filter: none; animation-duration: 2.4s; }
    @keyframes pulseHex { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    .logo-core .glyph {
      position: relative; z-index: 1;
      font-size: 26px; font-weight: 700; color: var(--cyber);
      text-shadow: 0 0 14px var(--cyber);
    }
    .login-brand h1 {
      font-size: 19px; font-weight: 600; letter-spacing: 1px;
      background: linear-gradient(90deg, #eaf6ff, var(--accent));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-brand .sub {
      margin-top: 8px; font-size: 12px; color: var(--text-mid);
      letter-spacing: .5px;
    }
    .login-brand .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--accent-3); box-shadow: 0 0 8px var(--accent-3); vertical-align: 1px; }

    /* ===== Alert ===== */
    .alert {
      display: none;
      position: relative;
      padding: 11px 14px 11px 38px;
      margin-bottom: 16px;
      border-radius: 10px;
      font-size: 12.5px; line-height: 1.6; letter-spacing: .3px;
    }
    .alert::before {
      content: "!";
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%; text-align: center; line-height: 16px;
      font-weight: 700; font-size: 12px;
    }
    .alert-error { background: rgba(239, 68, 68, .12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, .35); }
    .alert-error::before { background: #ef4444; color: #0a0f1f; }
    .alert-success { background: rgba(34, 197, 94, .12); color: #86efac; border: 1px solid rgba(34, 197, 94, .35); }
    .alert-success::before { background: #22c55e; color: #0a0f1f; }

    /* ===== 表单 ===== */
    .field { margin-bottom: 18px; }
    .field label {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--text-mid); margin-bottom: 8px; letter-spacing: .5px;
    }
    .field label .hint { color: var(--text-low); font-size: 11px; }
    .input-wrap { position: relative; }
    .input-wrap .lead {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-low); font-size: 14px; pointer-events: none; transition: color .2s;
    }
    .field input {
      width: 100%; height: 46px;
      padding: 0 12px 0 38px;
      background: rgba(8, 14, 32, .6);
      border: 1px solid rgba(120, 152, 200, .28);
      border-radius: 10px;
      color: var(--text-hi); font-size: 14px; font-family: inherit;
      outline: none; caret-color: var(--cyber);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .field input::placeholder { color: #51618a; }
    .field input:focus, .field input:focus + .lead {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, .4), 0 0 16px rgba(34, 211, 238, .18);
      background: rgba(10, 18, 40, .85);
    }
    .field input:focus { color: var(--cyber); }

    /* 验证码 */
    .captcha-row { display: flex; gap: 10px; }
    .captcha-row .input-wrap { flex: 1; }
    .captcha-img {
      width: 112px; height: 46px; flex-shrink: 0;
      border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(120, 152, 200, .28);
      overflow: hidden; background: rgba(8, 14, 32, .6);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-low); font-size: 11px; letter-spacing: .5px;
      transition: border-color .2s, box-shadow .2s;
      position: relative;
    }
    .captcha-img:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(34, 211, 238, .2); }
    .captcha-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .captcha-img.loading span::after {
      content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 6px;
      border: 2px solid transparent; border-top-color: var(--accent); border-radius: 50%;
      vertical-align: -2px; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 提交按钮 */
    .submit-btn {
      position: relative;
      width: 100%; height: 48px; margin-top: 6px;
      border: none; border-radius: 10px; cursor: pointer;
      color: #04121a; font-size: 15px; font-weight: 700; letter-spacing: 4px; font-family: inherit;
      background: linear-gradient(100deg, #22d3ee, #3b82f6 55%, #22d3ee);
      background-size: 200% 100%;
      animation: btnFlow 4s linear infinite;
      box-shadow: 0 8px 26px rgba(34, 211, 238, .35);
      overflow: hidden;
      transition: transform .12s, box-shadow .2s;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(34, 211, 238, .5); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; animation: none; }
    @keyframes btnFlow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

    /* 底部安全提示 */
    .login-footer {
      margin-top: 22px; padding-top: 18px;
      border-top: 1px dashed rgba(120, 152, 200, .18);
      text-align: center; font-size: 11px; color: var(--text-low); line-height: 2;
    }
    .login-footer .sys-tag { color: var(--accent); opacity: .85; }

    @media (max-width: 480px) {
      .login-card { padding: 30px 22px 22px; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="scanline"></div>
  <div class="particles" id="particles"></div>

  <div class="login-wrap">
    <div class="glow-ring">
      <div class="login-card">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="login-brand">
          <div class="logo-core">
            <div class="logo-hex dark"></div>
            <div class="logo-hex"></div>
            <div class="glyph">L</div>
          </div>
          <h1>lrcore 统一认证中心</h1>
          <div class="sub"><span class="status-dot"></span>单点登录 · 一次登录，全平台通行</div>
        </div>

        <div id="errorAlert" class="alert alert-error" style="display:__ERROR_DISPLAY__">__ERROR_MSG__</div>
        <div id="logoutAlert" class="alert alert-success" style="display:__LOGOUT_FLAG__">您已安全退出，可重新登录</div>

        <form id="loginForm" action="/login" method="post" autocomplete="off">
          <input type="hidden" name="_csrf" value="__CSRF_TOKEN__">

          <div class="field">
            <label for="username">用户名 <span class="hint">USER ID</span></label>
            <div class="input-wrap">
              <span class="lead">⌂</span>
              <input id="username" name="username" type="text" placeholder="请输入用户名 / 账号" required autofocus value="admin">
            </div>
          </div>

          <div class="field">
            <label for="password">密码 <span class="hint">SECURE</span></label>
            <div class="input-wrap">
              <span class="lead">◆</span>
              <input id="password" name="password" type="password" placeholder="请输入密码" required value="Lr@123456.">
            </div>
          </div>

          <div class="field">
            <label for="captcha">验证码 <span class="hint">CAPTCHA</span></label>
            <div class="captcha-row">
              <div class="input-wrap">
                <span class="lead">&#9673;</span>
                <input id="captcha" name="captcha" type="text" maxlength="4" placeholder="4 位验证码" required>
              </div>
              <input type="hidden" id="captchaId" name="captchaId">
              <div class="captcha-img" id="captchaBox" title="点击刷新验证码">
                <span id="captchaTip">点击加载</span>
              </div>
            </div>
          </div>

          <button class="submit-btn" id="submitBtn" type="submit">登 录</button>
        </form>

        <div class="login-footer">
          登录即表示同意按本平台安全策略完成身份验证<br>
          <span class="sys-tag">[SECURE]</span> 连续输错密码将触发账户 / IP 临时锁定
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var box = document.getElementById("captchaBox");
      var tip = document.getElementById("captchaTip");
      var idInput = document.getElementById("captchaId");
      var form = document.getElementById("loginForm");
      var submitBtn = document.getElementById("submitBtn");

      function loadCaptcha() {
        box.className = "captcha-img loading";
        tip.style.display = "";
        tip.textContent = "加载中";
        fetch("/sso/captcha", { credentials: "same-origin" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (body) {
            var data = body.data || body;
            if (!data || !data.uuid) throw new Error("invalid captcha response");
            idInput.value = data.uuid;
            box.className = "captcha-img";
            box.innerHTML = "";
            var img = document.createElement("img");
            img.src = data.img;
            img.alt = "验证码";
            box.appendChild(img);
            document.getElementById("captcha").value = "";
          })
          .catch(function () {
            box.className = "captcha-img";
            tip.textContent = "加载失败，点击重试";
          });
      }

      /* 生成流动粒子（轻量） */
      function spawnParticles() {
        var wrap = document.getElementById("particles");
        var n = 42;
        for (var i = 0; i < n; i++) {
          (function () {
            var p = document.createElement("i");
            var left = Math.random() * 100;
            var drift = (Math.random() - 0.5) * 120 + "px";
            var dur = 7 + Math.random() * 10 + "s";
            var delay = Math.random() * 12 + "s";
            p.style.left = left + "%";
            p.style.setProperty("--drift", drift);
            p.style.animationDuration = dur;
            p.style.animationDelay = delay;
            wrap.appendChild(p);
          })();
        }
      }

      box.addEventListener("click", loadCaptcha);
      form.addEventListener("submit", function (e) {
        if (!idInput.value) {
          e.preventDefault();
          loadCaptcha();
          tip.textContent = "请先加载验证码";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "验 证 中…";
      });

      // 页面聚焦时自动加载一次（若已有错误提示，说明刚登录失败，验证码已被消费，必须刷新）
      if (document.getElementById("errorAlert").style.display === "block" || !idInput.value) {
        loadCaptcha();
      }

      spawnParticles();
    })();
  </script>
</body>
</html>
