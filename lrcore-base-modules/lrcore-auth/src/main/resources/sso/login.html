<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一登录 - lrcore 认证中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 55%, #60a5fa 100%);
      color: #1f2937;
    }
    .login-card {
      width: 400px;
      max-width: calc(100vw - 40px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, .25);
      padding: 40px 36px 32px;
    }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-brand .logo {
      width: 52px; height: 52px; border-radius: 12px; margin: 0 auto 12px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #fff; font-size: 26px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .login-brand h1 { font-size: 20px; font-weight: 600; }
    .login-brand p { font-size: 13px; color: #6b7280; margin-top: 6px; }
    .alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
    .field input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .captcha-row { display: flex; gap: 10px; }
    .captcha-row input { flex: 1; }
    .captcha-img {
      width: 110px; height: 42px; border-radius: 8px; cursor: pointer;
      border: 1px solid #d1d5db; overflow: hidden; background: #f3f4f6;
      display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px;
    }
    .captcha-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .submit-btn {
      width: 100%; height: 44px; margin-top: 4px;
      border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff; font-size: 15px; font-weight: 600;
      transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .92; }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-footer {
      margin-top: 22px; text-align: center;
      font-size: 12px; color: #9ca3af; line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">L</div>
      <h1>lrcore 统一认证中心</h1>
      <p>单点登录 · 一次登录，全平台通行</p>
    </div>

    <div id="errorAlert" class="alert alert-error" style="display:__ERROR_DISPLAY__">__ERROR_MSG__</div>
    <div id="logoutAlert" class="alert alert-success" style="display:__LOGOUT_FLAG__">您已安全退出，可重新登录</div>

    <form id="loginForm" action="/login" method="post" autocomplete="off">
      <input type="hidden" name="_csrf" value="__CSRF_TOKEN__">

      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="请输入用户名" required autofocus>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" required>
      </div>

      <div class="field">
        <label for="captcha">验证码</label>
        <div class="captcha-row">
          <input id="captcha" name="captcha" type="text" maxlength="4" placeholder="请输入验证码" required>
          <input type="hidden" id="captchaId" name="captchaId">
          <div class="captcha-img" id="captchaBox" title="点击刷新验证码">
            <span id="captchaTip">点击加载</span>
          </div>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" type="submit">登 录</button>
    </form>

    <div class="login-footer">
      登录即表示同意按本平台安全策略完成身份验证<br>
      连续输错密码将触发账户 / IP 临时锁定
    </div>
  </div>

  <script>
    (function () {
      var box = document.getElementById("captchaBox");
      var tip = document.getElementById("captchaTip");
      var idInput = document.getElementById("captchaId");
      var form = document.getElementById("loginForm");
      var submitBtn = document.getElementById("submitBtn");

      function loadCaptcha() {
        box.style.display = "flex";
        tip.style.display = "";
        tip.textContent = "加载中…";
        fetch("/sso/captcha", { credentials: "same-origin" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (body) {
            var data = body.data || body;
            if (!data || !data.uuid) throw new Error("invalid captcha response");
            idInput.value = data.uuid;
            box.innerHTML = "";
            var img = document.createElement("img");
            img.src = data.img;
            img.alt = "验证码";
            box.appendChild(img);
            document.getElementById("captcha").value = "";
          })
          .catch(function () {
            tip.textContent = "加载失败，点击重试";
          });
      }

      box.addEventListener("click", loadCaptcha);
      form.addEventListener("submit", function (e) {
        if (!idInput.value) {
          e.preventDefault();
          loadCaptcha();
          tip.textContent = "请先加载验证码";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "登录中…";
      });

      // 页面聚焦时自动加载一次（若已有错误提示，说明刚登录失败，验证码已被消费，必须刷新）
      if (document.getElementById("errorAlert").style.display === "block" || !idInput.value) {
        loadCaptcha();
      }
    })();
  </script>
</body>
</html>
