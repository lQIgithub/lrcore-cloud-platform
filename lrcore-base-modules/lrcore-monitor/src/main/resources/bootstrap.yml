# Tomcat
server:
  port: 9100

# Spring
spring:
  application:
    # 应用名称
    name: ${service-name-monitor}
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 10.10.10.50:8848
        namespace: 82a58fa2-662e-4b85-ad3a-75b9958ee024
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        # 配置中心地址
        server-addr: 10.10.10.50:8848
        namespace: 82a58fa2-662e-4b85-ad3a-75b9958ee024
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - nacos:application-${nacos.active}.${nacos.file-extension}
      - nacos:${service-name-monitor}-${nacos.active}.${nacos.file-extension}
